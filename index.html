<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
/*
VOICE: tenang dan rapi seperti aplikasi bawaan iPhone
IDEA: app Pengaturan iOS — daftar berkelompok, tab bar bawah, halaman dorong dengan tombol kembali
PICTURE: alatnya sendiri: kolom link/file, pilihan, hasil dengan pratinjau
COLOUR and TYPE: abu sistem #f2f2f7/hitam, kartu putih/#1c1c1e, aksen biru iOS, ikon berwarna; SF Pro (system-ui)
LAYOUT: satu kolom 600px, judul besar, grup inset, tab bar tetap di bawah
*/
:root{color-scheme:light dark;
  --bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#f2f2f7,#2c2c2e);
  --ink:light-dark(#000,#fff);--sub:light-dark(#8a8a8e,#8d8d93);--sep:light-dark(#c6c6c8,#38383a);
  --blue:light-dark(#007aff,#0a84ff);--red:light-dark(#ff3b30,#ff453a);--green:light-dark(#34c759,#30d158);
  --fill:light-dark(#7676801f,#7676803d);--bar:light-dark(#f9f9f9d9,#1d1d1fd9);--segon:light-dark(#fff,#636366)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  overflow-x:clip;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;border-bottom:.5px solid transparent}
.nav.line{border-bottom-color:var(--sep)}
.nav .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.nav.line .t{opacity:1}
.back{justify-self:start;border:0;background:none;color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;cursor:pointer;padding:6px 8px;min-height:44px}
.back svg{width:13px;height:21px}
main{max-width:600px;margin:0 auto;padding:0 16px 32px}
h1{font-size:34px;line-height:1.1;font-weight:700;margin:2px 4px 6px;display:flex;align-items:center;gap:10px}
h1 .logo{width:36px;height:36px;flex:none}
.lead{color:var(--sub);font-size:15px;margin:0 4px 6px}

.hdr{font-size:13px;color:var(--sub);text-transform:uppercase;margin:24px 16px 7px}
.foot{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px;position:relative;width:100%;border:0;background:none;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.ic+.cell.ic::before{left:58px}
button.cell,a.cell{cursor:pointer;color:inherit;text-decoration:none}button.cell:active{background:var(--card2)}
.grow{flex:1}.cell .val{color:var(--sub);font-size:15px;white-space:nowrap}
.cell small{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.chev{width:8px;height:14px;color:#c4c4c7;flex:none}
.chk{color:var(--blue);font-weight:600;visibility:hidden}.sel .chk{visibility:visible}
.icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.field{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;min-height:44px}
.field input,.field select{flex:1;border:0;background:none;outline:none;font-size:17px;padding:8px 0}
.field input::placeholder,textarea::placeholder{color:var(--sub)}
.field label{color:var(--ink);white-space:nowrap}
textarea{width:100%;border:0;background:none;outline:none;font-size:17px;padding:12px 16px;min-height:160px;resize:vertical;display:block}
.pill{border:0;background:var(--fill);color:var(--blue);font-weight:600;font-size:15px;border-radius:99px;padding:7px 14px;cursor:pointer;min-height:34px;white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;padding:15px;margin-top:16px;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{opacity:.75}.btn:disabled{opacity:.4;cursor:default}
.btn.sec{background:var(--card);color:var(--blue)}
.mini{border:0;background:none;color:var(--blue);font-size:15px;cursor:pointer;padding:6px;min-width:32px;min-height:32px}
.mini.red{color:var(--red)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 4px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;min-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--segon);font-weight:600;box-shadow:0 3px 8px #0000001f,0 3px 1px #0000000a}
.segwrap{padding:8px 12px}
.range{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px}
.range input{flex:1;accent-color:var(--blue)}
.range output{min-width:52px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}

.plats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 4px 0}
.plats span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--sub);transition:.2s}
.plats span.on{background:var(--blue);color:#fff}
.prev{display:flex;gap:12px;align-items:center;padding:12px 16px}
.thumb{width:96px;aspect-ratio:16/10;border-radius:8px;background:var(--card2) center/cover;flex:none}
.prev h3{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev p{font-size:13px;color:var(--sub);margin-top:3px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 16px;text-align:center;cursor:pointer;color:var(--sub);font-size:15px}
.drop b{color:var(--blue);font-weight:600;font-size:17px}
.drop.over{background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.tn{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--card2);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--sub)}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.save{color:var(--green)}

.toast{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:15px;display:none;background:var(--card)}
.toast.show{display:flex;gap:10px;align-items:flex-start}
.toast.err{color:var(--red)}.toast.ok{color:var(--green)}.toast.info{color:var(--sub)}
.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:12px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.prog.ind i{width:30%;animation:run 1.1s infinite ease-in-out}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;flex:none;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--sep)}
.stats div{background:var(--card);padding:12px 8px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--sub)}
.big{font-size:44px;font-weight:700;text-align:center;padding:18px 16px 4px;font-variant-numeric:tabular-nums;line-height:1}
.bigsub{text-align:center;color:var(--sub);font-size:15px;padding-bottom:16px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:19px;word-break:break-all;padding:16px;text-align:center}
#qrBox{display:grid;place-items:center;padding:20px;background:#fff}
#qrBox img,#qrBox canvas{max-width:100%;height:auto}
.ipk{display:grid;grid-template-columns:minmax(0,1fr) 64px 76px 32px;gap:6px;align-items:center;padding:6px 8px 6px 16px}
.ipk input,.ipk select{border:0;background:var(--card2);border-radius:8px;padding:8px;font-size:16px;width:100%}
.ipk+.ipk{border-top:.5px solid var(--sep)}
.sig{display:block;width:100%;height:220px;background:#fff;touch-action:none;cursor:crosshair}

.ck{background:repeating-conic-gradient(#d1d1d6 0 25%,#fff 0 50%) 0 0/12px 12px!important}

/* editor PDF */
.etb{position:sticky;top:calc(env(safe-area-inset-top) + 52px);z-index:4;margin:12px -16px 0;padding:8px 12px;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.etb .seg button{font-size:12px;padding:6px 2px}
.eopt{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:34px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--sep);cursor:pointer;flex:none}
.dot.on{box-shadow:0 0 0 2px var(--blue)}
.tgl{border:0;background:var(--fill);border-radius:8px;min-width:34px;height:30px;font-weight:600;cursor:pointer;padding:0 8px;font-size:14px}
.tgl.on{background:var(--blue);color:#fff}
.pages{display:grid;gap:14px;margin-top:14px}
.pg{position:relative;background:#fff;box-shadow:0 1px 6px #0003;border-radius:2px;overflow:hidden}
.pg canvas{display:block;width:100%;height:auto}
.pgno{position:absolute;right:6px;bottom:6px;font-size:11px;background:#0008;color:#fff;border-radius:6px;padding:2px 6px;pointer-events:none;z-index:3}
.ov{position:absolute;inset:0;touch-action:pan-y}
.ov.draw{touch-action:none;cursor:crosshair}
.ob{position:absolute}
.ob:not(.text){touch-action:none}
.ob .in{position:absolute;inset:0}
.ob.text .in{position:static;font-family:Helvetica,Arial,sans-serif;line-height:1.2;white-space:pre;outline:none;min-width:10px;padding:0;cursor:text;-webkit-user-select:text;user-select:text}
.ob.text .in:empty::before{content:"Ketik…";color:#aaa}
.ob.erase .in{background:#fff;outline:1px dashed #ff3b30}
.ob.highlight .in{mix-blend-mode:multiply;opacity:.38}
.ob.image img{width:100%;height:100%;display:block;pointer-events:none}
.ob svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ob.sel{outline:1.5px solid var(--blue);outline-offset:2px}
.hd{position:absolute;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;line-height:1;touch-action:none;z-index:2;box-shadow:0 1px 4px #0005;cursor:grab}
.hd[data-h=move]{left:-17px;top:-17px;background:var(--blue)}
.hd[data-h=del]{right:-17px;top:-17px;background:var(--red);cursor:pointer}
.hd[data-h=size]{right:-17px;bottom:-17px;background:var(--blue);cursor:nwse-resize}
.tmp{position:absolute;border:1.5px dashed var(--blue);background:#007aff14;pointer-events:none}
.rep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;padding:6px 8px 6px 16px;align-items:center}
.rep input{border:0;background:var(--card2);border-radius:8px;padding:8px;font-size:16px;width:100%}
.rep+.rep{border-top:.5px solid var(--sep)}
.tx{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;line-height:1.5;min-height:320px;white-space:pre-wrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sub);padding:4px 0;cursor:pointer;min-height:48px}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.legal{text-align:center;font-size:12px;color:var(--sub);margin-top:28px;line-height:1.5}
.hide{display:none!important}
.view{animation:push .28s cubic-bezier(.3,.7,.4,1)}
@keyframes push{from{opacity:.4;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function toast(el, type, text){
  el.className = "toast show " + type;
  el.innerHTML = (type === "info" ? '<span class="spin"></span>' : "") + "<span>" + esc(text) + "</span>";
}
const hideToast = el => el.className = "toast";
function prog(el, p){
  if(p === null){ el.style.display = "none"; el.classList.remove("ind"); return; }
  el.style.display = "block";
  if(p < 0){ el.classList.add("ind"); el.firstElementChild.style.width = ""; }
  else { el.classList.remove("ind"); el.firstElementChild.style.width = p + "%"; }
}

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function saveBlob(blob, name){
  if(isIOS && navigator.canShare){
    const f = new File([blob], name, {type:blob.type || "application/octet-stream"});
    if(navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(e => { if(e.name !== "AbortError") downloadBlob(blob, name); }); return; }
  }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 120000);
}

async function readResp(resp, fallback, barEl){
  if(!resp.ok){ let t = "Gagal memproses."; try { t = (await resp.json()).error || t } catch {} throw new Error(t); }
  const total = +resp.headers.get("Content-Length") || 0;
  const cd = resp.headers.get("Content-Disposition") || "";
  const mm = cd.match(/filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i);
  const name = mm ? decodeURIComponent(mm[1] || mm[2]) : fallback;
  const rd = resp.body.getReader(), parts = []; let got = 0;
  for(;;){ const {done, value} = await rd.read(); if(done) break; parts.push(value); got += value.length; if(total && barEl) prog(barEl, Math.round(got / total * 100)); }
  return {blob:new Blob(parts, {type:resp.headers.get("Content-Type") || "application/octet-stream"}), name};
}

const results = [];
function addResult(blob, name, before){
  const url = URL.createObjectURL(blob);
  const isImg = blob.type.startsWith("image/");
  const diff = before ? Math.round((1 - blob.size / before) * 100) : null;
  const out = $("#out");
  if(!out.firstChild) out.innerHTML = `<div class="hdr">Hasil</div><div class="group" id="outList"></div><button class="btn sec hide" id="saveAll" type="button">Simpan Semua</button>`;
  const row = document.createElement("div"); row.className = "cell";
  row.innerHTML = `${isImg ? `<img class="tn${/png$/.test(name) ? " ck" : ""}" src="${url}" alt="">` : `<div class="tn">${esc(extOf(name).toUpperCase().slice(0, 4))}</div>`}
    <div class="grow"><div class="name">${esc(name)}</div><small>${kb(blob.size)}${diff !== null ? (diff > 0 ? ` · <span class="save">hemat ${diff}%</span>` : " · tidak lebih kecil") : ""}</small></div>
    <button class="pill" type="button">Simpan</button>`;
  row.querySelector("button").onclick = () => saveBlob(blob, name);
  $("#outList").appendChild(row);
  results.push({blob, name});
  if(results.length > 1){ $("#saveAll").classList.remove("hide"); $("#saveAll").onclick = () => results.forEach((r, i) => setTimeout(() => saveBlob(r.blob, r.name), i * 600)); }
}
async function run(t){
  const m = $("#msg"), btn = $("#run"), v = vals(t);
  for(const f of t.fields || []) if(["text","password"].includes(f.type) && f.name !== "pages" && !v[f.name] && (!f.show || f.show(v)))
    return toast(m, "err", "Isi dulu: " + f.label.toLowerCase());
  if(["hapus-hal"].includes(t.id) && !v.pages) return toast(m, "err", "Tulis halaman yang mau dihapus. Contoh: 2,4-5");
  if(t.id === "pisah-pdf" && v.mode === "range" && !v.pages) return toast(m, "err", "Tulis halaman yang mau diambil. Contoh: 1-3,5");
  results.length = 0; $("#out").innerHTML = "";
  btn.disabled = true; prog($("#bar"), -1);
  let ok = 0, fail = 0, lastErr = "";
  const jobs = t.batch || t.client ? files.map(f => [f]) : [files];
  for(let i = 0; i < jobs.length; i++){
    toast(m, "info", jobs.length > 1 ? `Memproses ${i + 1} dari ${jobs.length}…` : (t.client ? "Memproses di HP…" : "Mengunggah & memproses di server…"));
    try {
      const r = t.client ? await CLIENT[t.client](jobs[i][0], v) : await serverJob(t, jobs[i], v);
      addResult(r.blob, r.name, r.before); ok++;
    } catch(e){ fail++; lastErr = netErr(e); }
    if(jobs.length > 1) prog($("#bar"), Math.round((i + 1) / jobs.length * 100));
  }
  btn.disabled = false; prog($("#bar"), null);
  if(!fail) toast(m, "ok", ok > 1 ? `Selesai: ${ok} file. Ketuk Simpan.` : "Selesai. Ketuk Simpan untuk menyimpan.");
  else toast(m, "err", (ok ? `${ok} berhasil, ${fail} gagal. ` : "") + lastErr);
}
async function serverJob(t, list, v){
  const fn = LOCAL[t.api]; if(!fn) throw new Error("Alat ini belum tersedia di versi web.");
  return fn(list, v);
}

// ---------- pemrosesan gambar di HP (tanpa server)
async function decode(file){
  try { return await createImageBitmap(file, {imageOrientation:"from-image"}); } catch {}
  return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("x")); im.src = URL.createObjectURL(file); });
}
function encode(src, w, h, type, q){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if(type === "image/jpeg"){ g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); }
  g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("Browser tidak bisa membuat format ini.")), type, q));
}
const MT = {jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp"};
async function viaServer(path, file, v, before){
  if(!LOCAL[path]) throw new Error(file.name + " tidak bisa dibaca di HP ini. Ubah dulu ke JPG.");
  const r = await LOCAL[path]([file], v); return {...r, before};
}
const CLIENT = {
  async compress(file, v){
    let src; try { src = await decode(file); } catch { return viaServer("/api/img/compress", file, v, file.size); }
    const max = +v.max || 0, W = src.width, H = src.height, k = max && Math.max(W, H) > max ? max / Math.max(W, H) : 1;
    const blob = await encode(src, Math.round(W * k), Math.round(H * k), MT[v.to], v.quality / 100);
    return {blob, name:`SatSet_${stem(file.name)}_kompres.${v.to}`, before:file.size};
  },
  async convert(file, v){
    const to = v.to;
    if(!MT[to]) return viaServer("/api/img/convert", file, {to, quality:v.quality});
    let src; try { src = await decode(file); } catch { return viaServer("/api/img/convert", file, {to, quality:v.quality}); }
    const blob = await encode(src, src.width, src.height, MT[to], v.quality / 100);
    if(to === "webp" && blob.type !== "image/webp") return viaServer("/api/img/convert", file, {to, quality:v.quality});
    return {blob, name:`SatSet_${stem(file.name)}.${to}`};
  },
  async resize(file, v){
    const src = await decode(file).catch(() => { throw new Error("Gambar tidak bisa dibaca di HP ini. Ubah dulu ke JPG."); });
    const k = v.mode === "pct" ? v.pct / 100 : Math.max(1, +v.w || 800) / src.width;
    const W = Math.max(1, Math.round(src.width * k)), H = Math.max(1, Math.round(src.height * k));
    const png = /png|gif|webp/.test(file.type), ext = png ? "png" : "jpg";
    const blob = await encode(src, W, H, MT[ext], .92);
    return {blob, name:`SatSet_${stem(file.name)}_${W}x${H}.${ext}`};
  }
};

      <div class="group"><label class="drop"><b id="gpick">Pilih Foto</b><span id="ghint">Bisa pilih banyak sekaligus</span>
        <input type="file" id="gfile" accept="${IMG}" multiple hidden></label></div>
      <div id="glist"></div>
      <div id="gcol">
        <div class="hdr">Kolom</div><div class="group">${segHTML("cols", [["1","1"],["2","2"],["3","3"]], "2")}</div>
        <div class="hdr">Ukuran hasil</div><div class="group">${segHTML("ratio", [["1:1","1:1 Feed"],["4:5","4:5 Feed"],["9:16","9:16 Story"],["3:2","3:2 Lanskap"]], "4:5")}</div>
        <div class="hdr">Jarak & sudut</div><div class="group">
          <div class="range"><span style="width:56px">Jarak</span><input type="range" id="gap" min="0" max="60" value="16"><output>16</output></div>
          <div class="range" style="border-top:.5px solid var(--sep)"><span style="width:56px">Sudut</span><input type="range" id="rad" min="0" max="60" value="0"><output>0</output></div></div>
        <div class="hdr">Warna latar</div><div class="group"><div class="eopt" style="padding:6px 16px 12px">${["#ffffff","#000000","#f2f2f7","#f5e6d3","#007aff","#ff2d55"].map((c, i) => `<button type="button" class="dot${i ? "" : " on"}" data-bg="${c}" style="background:${c}" aria-label="Latar ${c}"></button>`).join("")}</div></div>
      </div>
      <div id="gsplit" class="hide">
        <div class="hdr">Grid</div><div class="group">${segHTML("grid", [["3x1","3×1 Panorama"],["3x2","3×2"],["3x3","3×3"],["3x4","3×4"]], "3x3")}</div>
        <div class="hdr">Bentuk tiap kotak</div><div class="group">${segHTML("tile", [["1:1","1:1"],["4:5","4:5"],["3:4","3:4 (grid profil baru)"]], "4:5")}</div>
        <div class="hdr">Posisi potong</div><div class="group">${segHTML("focus", [["0","Atas/Kiri"],["0.5","Tengah"],["1","Bawah/Kanan"]], "0.5")}</div>
      </div>
      <div class="hdr">Pratinjau</div><div class="group" style="padding:12px;background:var(--card2)"><canvas id="gcv" style="display:block;width:100%;height:auto;border-radius:4px"></canvas>
        <p class="foot" id="gnote" style="margin:8px 4px 0;text-align:center">Pilih foto dulu</p></div>
      <button class="btn" id="gsave" type="button" disabled>Buat</button>
      <div class="toast" id="msg"></div><div id="out"></div>`,
    bind(){
      const root = $("#main"), cv = $("#gcv"), g = cv.getContext("2d");
      let mode = "collage", imgs = [], bg = "#ffffff";
      const val = n => segVal(root, n);
      const R = r => { const [a, b] = r.split(":").map(Number); return a / b; };
      function cover(ctx, im, x, y, w, h, fx = .5, fy = .5){
        const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s;
        ctx.drawImage(im, (im.width - sw) * fx, (im.height - sh) * fy, sw, sh, x, y, w, h);
      }
      function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if(ctx.roundRect && r) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
      function collage(W){
        const H = Math.round(W / R(val("ratio"))), cols = +val("cols"), k = W / 1080;
        const gap = +$("#gap").value * k, rad = +$("#rad").value * k;
        const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
        x.fillStyle = bg; x.fillRect(0, 0, W, H);
        const n = imgs.length, rows = Math.ceil(n / cols), rh = (H - gap * (rows + 1)) / rows;
        let i = 0;
        for(let r = 0; r < rows; r++){
          const inRow = Math.min(cols, n - i), cw = (W - gap * (inRow + 1)) / inRow;
          for(let j = 0; j < inRow; j++, i++){
            const cx = gap + j * (cw + gap), cy = gap + r * (rh + gap);
            x.save(); rr(x, cx, cy, cw, rh, rad); x.clip(); cover(x, imgs[i].im, cx, cy, cw, rh); x.restore();
          }
        }
        return c;
      }
      function splitDims(){ const [cols, rows] = val("grid").split("x").map(Number), t = R(val("tile")); return {cols, rows, tw:1080, th:Math.round(1080 / t)}; }
      function splitSource(){
        const {cols, rows, tw, th} = splitDims(), W = cols * tw, H = rows * th, f = +val("focus");
        const c = document.createElement("canvas"); c.width = W; c.height = H; cover(c.getContext("2d"), imgs[0].im, 0, 0, W, H, f, f); return c;
      }
      function draw(){
        const ok = mode === "collage" ? imgs.length >= 2 : imgs.length >= 1;
        $("#gsave").disabled = !ok;
        if(!ok){ cv.width = 600; cv.height = 300; g.fillStyle = "#ddd"; g.fillRect(0, 0, 600, 300); $("#gnote").textContent = mode === "collage" ? "Pilih minimal 2 foto" : "Pilih 1 foto"; return; }
        if(mode === "collage"){
          const c = collage(720); cv.width = c.width; cv.height = c.height; g.drawImage(c, 0, 0);
          $("#gnote").textContent = `${imgs.length} foto · hasil 1080×${Math.round(1080 / R(val("ratio")))} px`;
        } else {
          const {cols, rows, tw, th} = splitDims(), src = splitSource(), k = 720 / src.width;
          cv.width = 720; cv.height = Math.round(src.height * k); g.drawImage(src, 0, 0, cv.width, cv.height);
          g.strokeStyle = "#fff"; g.lineWidth = 3; g.font = "600 28px -apple-system,system-ui,sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
          for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
            const x = c * tw * k, y = r * th * k, w = tw * k, h = th * k, n = (rows - r - 1) * cols + (cols - c);
            g.strokeRect(x, y, w, h); g.fillStyle = "#000a"; g.beginPath(); g.arc(x + w / 2, y + h / 2, 24, 0, 7); g.fill(); g.fillStyle = "#fff"; g.fillText(n, x + w / 2, y + h / 2 + 1);
          }
          $("#gnote").textContent = `${cols * rows} kotak ${tw}×${th} px · angka = urutan upload (mulai dari 1)`;
        }
      }
      function list(){
        const box = $("#glist");
        if(mode !== "collage" || !imgs.length){ box.innerHTML = ""; return; }
        box.innerHTML = `<div class="hdr">${imgs.length} foto · atur urutan</div><div class="group">${imgs.map((o, i) => `<div class="cell"><img class="tn" src="${o.url}" alt="">
          <div class="grow"><div class="name">${esc(o.name)}</div></div>
          <button class="mini" data-up="${i}" type="button" aria-label="Naik">↑</button><button class="mini" data-dn="${i}" type="button" aria-label="Turun">↓</button><button class="mini red" data-rm="${i}" type="button" aria-label="Hapus">✕</button></div>`).join("")}</div>`;
        box.onclick = e => { const b = e.target.closest("button"); if(!b) return; const i = +(b.dataset.up ?? b.dataset.dn ?? b.dataset.rm);
          if(b.dataset.rm !== undefined) imgs.splice(i, 1); else { const j = b.dataset.up !== undefined ? i - 1 : i + 1; if(j < 0 || j >= imgs.length) return; [imgs[i], imgs[j]] = [imgs[j], imgs[i]]; }
          list(); draw(); };
      }
      bindSegs(root, () => {
        const m = val("gmode");
        if(m !== mode){ mode = m; if(mode === "split") imgs = imgs.slice(0, 1);
          $("#gcol").classList.toggle("hide", mode !== "collage"); $("#gsplit").classList.toggle("hide", mode !== "split");
          $("#ghdr").textContent = mode === "collage" ? "Foto (2–9)" : "Foto";
          $("#ghint").textContent = mode === "collage" ? "Bisa pilih banyak sekaligus" : "1 foto, sebaiknya resolusi tinggi";
          $("#gfile").multiple = mode === "collage"; $("#gsave").textContent = mode === "collage" ? "Buat Kolase" : "Pecah Jadi Grid";
          results.length = 0; $("#out").innerHTML = ""; hideToast($("#msg")); list(); }
        draw();
      });
      root.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => { r.nextElementSibling.textContent = r.value; draw(); });
      root.querySelectorAll("[data-bg]").forEach(d => d.onclick = () => { bg = d.dataset.bg; root.querySelectorAll("[data-bg]").forEach(x => x.classList.toggle("on", x === d)); draw(); });
      $("#gfile").onchange = async e => {
        const fs = [...e.target.files]; e.target.value = "";
        for(const f of fs){ try { imgs.push({im:await decode(f), name:f.name, url:URL.createObjectURL(f)}); } catch { toast($("#msg"), "err", f.name + " tidak bisa dibaca."); } }
        if(mode === "split") imgs = imgs.slice(-1);
        if(imgs.length > 9){ imgs = imgs.slice(0, 9); toast($("#msg"), "err", "Maksimal 9 foto untuk kolase."); }
        list(); draw();
      };
      const toBlob = c => new Promise(r => c.toBlob(r, "image/jpeg", .92));
      $("#gsave").onclick = async () => {
        const m = $("#msg"); results.length = 0; $("#out").innerHTML = "";
        toast(m, "info", "Membuat…");
        if(mode === "collage"){ addResult(await toBlob(collage(1080)), "SatSet_kolase.jpg"); return toast(m, "ok", "Kolase siap. Ketuk Simpan."); }
        const {cols, rows, tw, th} = splitDims(), src = splitSource();
        for(let n = 1; n <= cols * rows; n++){
          const idx = cols * rows - n, r = Math.floor(idx / cols), c = idx % cols;
          const t = document.createElement("canvas"); t.width = tw; t.height = th;
          t.getContext("2d").drawImage(src, c * tw, r * th, tw, th, 0, 0, tw, th);
          addResult(await toBlob(t), `SatSet_grid_${String(n).padStart(2, "0")}.jpg`);
        }
        toast(m, "ok", `${cols * rows} foto siap. Upload ke Instagram mulai dari nomor 01, satu per satu.`);
      };
      draw();
    }
  },

  // ---------- EDIT TXT
  txt:{
    html:() => `<div class="group">
        <div class="field"><label for="fn">Nama file</label><input id="fn" placeholder="catatan" autocapitalize="off" style="text-align:right"></div>
        <label class="cell" style="cursor:pointer;border-top:.5px solid var(--sep)"><span class="grow" style="color:var(--blue)">Buka file teks…</span><span class="val">TXT, MD, CSV, SRT, JSON</span>
          <input type="file" id="tf" accept=".txt,.md,.csv,.srt,.vtt,.json,.html,.xml,.log,.ini,.yaml,.yml,text/*" hidden></label>
        <button class="cell" id="tnew" type="button" style="border-top:.5px solid var(--sep)"><span class="grow" style="color:var(--red)">Dokumen baru</span></button></div>
      <div class="hdr">Isi</div><div class="group"><textarea id="tx" class="tx" spellcheck="false" placeholder="Mulai ketik di sini…"></textarea></div>
      <p class="foot" id="txst"></p>
      <div class="hdr">Cari & ganti</div><div class="group">
        <div class="field"><input id="tfind" placeholder="Cari kata…" autocapitalize="off"><span class="val" id="tfc"></span></div>
        <div class="field" style="border-top:.5px solid var(--sep)"><input id="trep" placeholder="Ganti dengan…" autocapitalize="off"></div>
        <button class="cell" id="tcase" type="button" style="border-top:.5px solid var(--sep)"><span class="grow">Bedakan huruf besar/kecil</span><span class="chk">✓</span></button></div>
      <button class="btn sec" id="trun" type="button">Ganti Semua</button>
      <div class="hdr">Simpan sebagai</div><div class="group">${segHTML("tfmt", [["txt","TXT"],["md","Markdown"],["pdf","PDF"],["docx","Word"]], "txt")}</div>
      <button class="btn" id="tsave" type="button">Simpan</button>
      <div class="prog" id="bar"><i></i></div><div class="toast" id="msg"></div><div id="out"></div>
      <p class="foot">Draf tersimpan otomatis di HP-mu. Semua dibuat langsung di HP.</p>`,
    bind(){
      const tx = $("#tx"), fn = $("#fn"), d = store.get("txt", {name:"catatan", text:""});
      tx.value = d.text; fn.value = d.name;
      const keep = () => store.set("txt", {name:fn.value, text:tx.value});
      const re = () => { const q = $("#tfind").value; if(!q) return null;
        return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g" + ($("#tcase").classList.contains("sel") ? "" : "i")); };
      const stat = () => { const s = tx.value, r = re();
        $("#txst").textContent = `${(s.match(/[^\s]+/g) || []).length} kata · ${s ? s.split("\n").length : 0} baris · ${s.length} karakter`;
        $("#tfc").textContent = r ? (s.match(r) || []).length + " ditemukan" : ""; keep(); };
      tx.oninput = fn.oninput = stat; $("#tfind").oninput = stat;
      $("#tcase").onclick = e => { e.currentTarget.classList.toggle("sel"); stat(); };
      $("#tf").onchange = async e => { const f = e.target.files[0]; if(!f) return;
        if(f.size > 5 * 1048576) return toast($("#msg"), "err", "File teks maksimal 5 MB.");
        tx.value = await f.text(); fn.value = f.name.replace(/\.[^.]+$/, ""); e.target.value = ""; stat(); hideToast($("#msg")); };
      let armed = false;
      $("#tnew").onclick = e => { const b = e.currentTarget.querySelector(".grow");
        if(!armed && tx.value){ armed = true; b.textContent = "Ketuk lagi untuk mengosongkan"; setTimeout(() => { armed = false; b.textContent = "Dokumen baru"; }, 3000); return; }
        tx.value = ""; fn.value = "catatan"; armed = false; b.textContent = "Dokumen baru"; stat(); tx.focus(); };
      $("#trun").onclick = () => { const r = re(); if(!r) return toast($("#msg"), "err", "Isi dulu kata yang dicari.");
        const n = (tx.value.match(r) || []).length; tx.value = tx.value.replace(r, () => $("#trep").value); stat();
        toast($("#msg"), n ? "ok" : "err", n ? `${n} kata diganti.` : "Kata tidak ditemukan."); };
      bindSegs($("#main"));
      $("#tsave").onclick = async () => {
        const fmt = segVal($("#main"), "tfmt"), name = (fn.value.trim() || "catatan").replace(/[\\/:*?"<>|]+/g, "_"), m = $("#msg");
        if(!tx.value.trim()) return toast(m, "err", "Dokumen masih kosong.");
        results.length = 0; $("#out").innerHTML = "";
        if(fmt === "txt" || fmt === "md"){ addResult(new Blob([tx.value], {type:"text/plain;charset=utf-8"}), `${name}.${fmt}`); return toast(m, "ok", "Siap. Ketuk Simpan."); }
        const b = $("#tsave"); b.disabled = true; prog($("#bar"), -1); toast(m, "info", "Membuat " + (fmt === "pdf" ? "PDF" : "Word") + "…");
        try { const fd = new FormData(); fd.append("file", new File([tx.value], name + ".txt", {type:"text/plain"})); fd.append("to", fmt);
          const out = await LOCAL["/api/doc/convert"]([fd.get("file")], {to:fmt});
          addResult(out.blob, out.name); toast(m, "ok", "Selesai. Ketuk Simpan.");
        } catch(e){ toast(m, "err", netErr(e)); } finally { b.disabled = false; prog($("#bar"), null); }
      };
      stat();
    }
  },

  // ---------- EDIT PDF
  pdfedit:{
    html:() => `<div class="hdr">File PDF</div><div class="group"><label class="drop" id="drop"><b>Pilih PDF</b><span>Maks 200 MB · maks 150 halaman</span>
        <input type="file" id="file" accept=".pdf,application/pdf" hidden></label></div>
      <div class="toast" id="lmsg"></div>
      <div id="ed" class="hide">
        <div class="etb">${segHTML("mode", [["select","Pilih"],["text","Teks"],["erase","Tutup"],["highlight","Stabilo"],["ink","Coret"],["image","Gambar"]], "text").replace('class="segwrap"', 'class=""')}
          <div class="eopt" id="eopt"></div></div>
        <div class="pages" id="pages"></div>
        <div class="group" style="margin-top:16px"><button class="cell" id="undo" type="button"><span class="grow" style="color:var(--blue)">↶ Batalkan objek terakhir</span><span class="val" id="cnt">0 objek</span></button></div>
        <button class="btn" id="save" type="button">Simpan PDF</button>
        <div class="prog" id="bar"><i></i></div><div class="toast" id="msg"></div><div id="out"></div>
      </div>
      <input type="file" id="imgin" accept="image/*" hidden>`,
    bind(){
      const LIB = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      const TC = ["#000000","#0a3d91","#c4161c","#1e7d32"], HC = ["#ffd60a","#7ee787","#ff8fab","#7cc7ff"], IC = ["#ff3b30","#000000","#0a84ff"];
      const st = {mode:"text", size:"12", color:"#000000", bold:false, hl:"#ffd60a", ink:"#ff3b30", iw:"0.004"};
      let pdfFile = null, pages = [], objs = [], hist = [], sel = null, uid = 0, tap = null;
      const W = 1000, find = id => objs.find(o => o.id === +id);
      const loadLib = () => window.pdfjsLib ? Promise.resolve(pdfjsLib) : new Promise((res, rej) => {
        const s = document.createElement("script"); s.src = LIB + "pdf.min.js";
        s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = LIB + "pdf.worker.min.js"; res(pdfjsLib); };
        s.onerror = () => rej(new Error("Gagal memuat pembaca PDF. Cek koneksi internet."));
        document.head.appendChild(s); });

      // --- opsi alat
      const dots = (list, cur, key) => list.map(c => `<button type="button" class="dot${c === cur ? " on" : ""}" data-c="${c}" data-key="${key}" style="background:${c}" aria-label="Warna ${c}"></button>`).join("");
      function opts(){
        const e = $("#eopt"), m = st.mode;
        e.innerHTML = m === "text" ? `<div class="seg" data-seg="size" style="flex:1;min-width:150px">${["10","12","14","18","24"].map(v => `<button type="button" data-v="${v}" class="${v === st.size ? "on" : ""}">${v}</button>`).join("")}</div>
            ${dots(TC, st.color, "color")}<button type="button" class="tgl${st.bold ? " on" : ""}" id="bold">B</button>`
          : m === "highlight" ? `Warna ${dots(HC, st.hl, "hl")} <span>· seret di atas tulisan</span>`
          : m === "ink" ? `${dots(IC, st.ink, "ink")}<div class="seg" data-seg="iw" style="flex:1;min-width:150px">${[["0.002","Tipis"],["0.004","Sedang"],["0.008","Tebal"]].map(([v, l]) => `<button type="button" data-v="${v}" class="${v === st.iw ? "on" : ""}">${l}</button>`).join("")}</div>`
          : m === "erase" ? "Seret kotak putih untuk menutup tulisan/gambar, lalu ketik teks baru di atasnya kalau perlu."
          : m === "image" ? `<button class="pill" type="button" id="pickimg">Pilih gambar / TTD</button><span>PNG transparan dari alat Tanda Tangan cocok di sini</span>`
          : "Ketuk objek untuk memilih. Seret ✥ untuk memindah, ◢ ubah ukuran, ✕ hapus. Geser halaman untuk scroll.";
        e.onclick = ev => {
          const d = ev.target.closest(".dot"), sb = ev.target.closest("[data-seg] button");
          if(d){ st[d.dataset.key] = d.dataset.c; if(sel && sel.type === "text" && d.dataset.key === "color"){ sel.color = d.dataset.c; restyle(sel); } opts(); }
          else if(sb){ const k = sb.parentElement.dataset.seg; st[k] = sb.dataset.v; if(k === "size" && sel && sel.type === "text"){ sel.size = +st.size; restyle(sel); } opts(); }
          else if(ev.target.id === "bold"){ st.bold = !st.bold; if(sel && sel.type === "text"){ sel.bold = st.bold; restyle(sel); } opts(); }
          else if(ev.target.id === "pickimg") $("#imgin").click();
        };
      }
      bindSegs($(".etb"), () => {
        st.mode = segVal($(".etb"), "mode"); select(null); opts();
        pages.forEach(P => P.ov.classList.toggle("draw", ["erase","highlight","ink"].includes(st.mode)));
        if(st.mode === "image") $("#imgin").click();
      });
      opts();

      // --- objek
      function place(o){
        const s = o.el.style;
        if(o.type === "ink"){
          const P = pages[o.page], H = W * P.hPt / P.wPt, pad = o.width / 2 + 0.002;
          const xs = o.points.map(p => p[0]), ys = o.points.map(p => p[1]);
          const bx = Math.min(...xs) - pad, by = Math.min(...ys) - pad * P.wPt / P.hPt, bw = Math.max(...xs) - bx + pad, bh = Math.max(...ys) - by + pad * P.wPt / P.hPt;
          Object.assign(s, {left:bx * 100 + "%", top:by * 100 + "%", width:bw * 100 + "%", height:bh * 100 + "%"});
          o.el.querySelector(".in").innerHTML = `<svg viewBox="${bx * W} ${by * H} ${bw * W} ${bh * H}" preserveAspectRatio="none"><path d="M${o.points.map(p => (p[0] * W).toFixed(1) + " " + (p[1] * H).toFixed(1)).join("L")}" fill="none" stroke="${o.color}" stroke-width="${o.width * W}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          return;
        }
        s.left = o.x * 100 + "%"; s.top = o.y * 100 + "%";
        if(o.type !== "text"){ s.width = o.w * 100 + "%"; s.height = o.h * 100 + "%"; }
      }
      function restyle(o){ const i = o.el.querySelector(".in");
        Object.assign(i.style, {fontSize:`calc(var(--k) * ${o.size}px)`, color:o.color, fontWeight:o.bold ? 700 : 400}); }
      function make(o){
        const el = document.createElement("div"); el.className = "ob " + o.type; el.dataset.id = o.id; o.el = el;
        const i = document.createElement("div"); i.className = "in"; el.appendChild(i);
        if(o.type === "text"){
          try { i.contentEditable = "plaintext-only"; } catch {} if(i.contentEditable !== "plaintext-only") i.contentEditable = "true";
          i.spellcheck = false; i.textContent = o.text; restyle(o);
          i.oninput = () => { o.text = i.innerText.replace(/\n$/, ""); };
          i.onfocus = () => select(o);
          i.onblur = () => setTimeout(() => { if(!o.text.trim() && objs.includes(o)) remove(o); }, 150);
        } else if(o.type === "highlight") i.style.background = o.color;
        else if(o.type === "image") i.innerHTML = `<img src="${o.data}" alt="">`;
        place(o); return el;
      }
      function add(o){ o.id = ++uid; objs.push(o); hist.push(o); pages[o.page].ov.appendChild(make(o)); count(); return o; }
      function remove(o){ objs = objs.filter(x => x !== o); o.el.remove(); if(sel === o) sel = null; count(); }
      const count = () => $("#cnt").textContent = objs.length + " objek";
      function select(o){
        if(sel && sel !== o && sel.el){ sel.el.classList.remove("sel"); sel.el.querySelectorAll(".hd").forEach(h => h.remove()); }
        if(sel === o) return; sel = o; if(!o) return;

    const k = Math.min(v.scale === "4" ? 4 : 2, Math.sqrt(16e6 / (w * h)));
    if(k <= 1.05) throw new Error("Foto ini sudah besar (lebih dari 16 MP).");
    const TW = Math.round(w * k), TH = Math.round(h * k);
    let cur = src, cw = w, ch = h;
    while(cw * 2 < TW){
      const c = document.createElement("canvas"); c.width = cw * 2; c.height = ch * 2;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(cur, 0, 0, c.width, c.height);
      cur = c; cw = c.width; ch = c.height;
    }
    const c = document.createElement("canvas"); c.width = TW; c.height = TH;
    const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(cur, 0, 0, TW, TH);
    sharpen(c, .6);
    return res(await canvasBlob(c, MT[fmt] || "image/jpeg", .95), `${stem(f.name)}_${Math.round(k * 10) / 10}x.${fmt}`);
  },
  async "/api/img/rmbg"([f], v){
    const src = await imgOf(f), k = Math.min(1, 2048 / Math.max(src.width, src.height));
    const W = Math.round(src.width * k), H = Math.round(src.height * k), S = 320;
    const sess = await rmbgSession(), ort = window.ort;
    const a = document.createElement("canvas"); a.width = a.height = S;
    const ag = a.getContext("2d"); ag.drawImage(src, 0, 0, S, S);
    const px = ag.getImageData(0, 0, S, S).data, inp = new Float32Array(3 * S * S), mean = [.485, .456, .406], sd = [.229, .224, .225];
    for(let i = 0; i < S * S; i++) for(let c = 0; c < 3; c++) inp[c * S * S + i] = (px[i * 4 + c] / 255 - mean[c]) / sd[c];
    const out = await sess.run({[sess.inputNames[0]]:new ort.Tensor("float32", inp, [1, 3, S, S])});
    const m = out[sess.outputNames[0]].data;
    let lo = Infinity, hi = -Infinity; for(const x of m){ if(x < lo) lo = x; if(x > hi) hi = x; }
    const mk = ag.createImageData(S, S);
    for(let i = 0; i < S * S; i++){ const val = Math.max(0, Math.min(1, ((m[i] - lo) / (hi - lo + 1e-8) - .08) / .84)) * 255; mk.data[i * 4] = mk.data[i * 4 + 1] = mk.data[i * 4 + 2] = val; mk.data[i * 4 + 3] = 255; }
    ag.putImageData(mk, 0, 0);
    const big = document.createElement("canvas"); big.width = W; big.height = H;
    const bg = big.getContext("2d"); bg.imageSmoothingQuality = "high"; bg.drawImage(a, 0, 0, W, H);
    const alpha = bg.getImageData(0, 0, W, H).data;
    const cut = document.createElement("canvas"); cut.width = W; cut.height = H;
    const cg = cut.getContext("2d"); cg.drawImage(src, 0, 0, W, H);
    const im = cg.getImageData(0, 0, W, H);
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
      const i = (y * W + x) * 4, al = alpha[i]; im.data[i + 3] = al;
      if(al > 24){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
    }
    cg.putImageData(im, 0, 0);
    let sx = 0, sy = 0, sw = W, sh = H;
    if(v.crop === "1" && x1 >= 0){ const p = Math.round(Math.max(W, H) * .03); sx = Math.max(0, x0 - p); sy = Math.max(0, y0 - p); sw = Math.min(W, x1 + p) - sx; sh = Math.min(H, y1 + p) - sy; }
    const fin = document.createElement("canvas"); fin.width = sw; fin.height = sh;
    const fg = fin.getContext("2d");
    if(v.bg && v.bg !== "transparent"){ fg.fillStyle = BGC[v.bg] || v.bg; fg.fillRect(0, 0, sw, sh); }
    fg.drawImage(cut, sx, sy, sw, sh, 0, 0, sw, sh);
    return res(await canvasBlob(fin, "image/png"), stem(f.name) + "_tanpa_bg.png");
  },
  async "/api/img/convert"([f], v){
    const to = v.to, src = await imgOf(f), name = stem(f.name);
    if(to === "pdf"){ const {PDFDocument} = await PDFL(); const d = await PDFDocument.create(); await addImagePage(d, f, false); return res(await pdfOut(d), name + ".pdf"); }
    if(to === "ico"){
      const n = Math.min(256, Math.max(src.width, src.height)), c = document.createElement("canvas"); c.width = c.height = n;
      const s = n / Math.max(src.width, src.height), w = src.width * s, h = src.height * s;
      c.getContext("2d").drawImage(src, (n - w) / 2, (n - h) / 2, w, h);
      const png = await bytesOf(await canvasBlob(c, "image/png")), head = new DataView(new ArrayBuffer(22));
      head.setUint16(2, 1, true); head.setUint16(4, 1, true); head.setUint8(6, n % 256); head.setUint8(7, n % 256);
      head.setUint16(10, 1, true); head.setUint16(12, 32, true); head.setUint32(14, png.length, true); head.setUint32(18, 22, true);
      return res(new Blob([head.buffer, png], {type:"image/x-icon"}), name + ".ico");
    }
    if(to === "bmp"){
      const W = src.width, H = src.height, c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(src, 0, 0);
      const px = g.getImageData(0, 0, W, H).data, row = Math.ceil(W * 3 / 4) * 4, size = 54 + row * H, b = new DataView(new ArrayBuffer(size));
      b.setUint16(0, 0x4d42, true); b.setUint32(2, size, true); b.setUint32(10, 54, true); b.setUint32(14, 40, true);
      b.setInt32(18, W, true); b.setInt32(22, H, true); b.setUint16(26, 1, true); b.setUint16(28, 24, true); b.setUint32(34, row * H, true);
      for(let y = 0; y < H; y++){ let o = 54 + (H - 1 - y) * row; for(let x = 0; x < W; x++){ const i = (y * W + x) * 4; b.setUint8(o++, px[i + 2]); b.setUint8(o++, px[i + 1]); b.setUint8(o++, px[i]); } }
      return res(new Blob([b.buffer], {type:"image/bmp"}), name + ".bmp");
    }
    if(MT[to]) return res(await encode(src, src.width, src.height, MT[to], (+v.quality || 92) / 100), `${name}.${to}`);
    throw new Error("Format tujuan tidak didukung.");
  },
  async "/api/doc/convert"([f], v){
    const ext = extOf(f.name), to = v.to, name = stem(f.name);
    if(ext === "pdf"){
      if(to === "txt"){
        const doc = await pdfjsDoc(f); let t = "";
        for(let i = 1; i <= doc.numPages; i++){ const tc = await (await doc.getPage(i)).getTextContent(); t += tc.items.map(it => it.str + (it.hasEOL ? "\n" : "")).join("") + "\n\n"; }
        if(!t.trim()) throw new Error("Tidak ada teks di PDF ini (mungkin hasil scan/foto).");
        return res(new Blob([t], {type:"text/plain;charset=utf-8"}), name + ".txt");
      }
      if(to === "jpg" || to === "png") return pdfImages(f, to, 150);
    }
    if(ext === "txt" || ext === "md"){
      const text = await f.text();
      if(to === "pdf") return res(await txtPdf(text), name + ".pdf");
      if(to === "docx") return res(await txtDocx(text), name + ".docx");
    }
    throw new Error("Konversi ini belum tersedia di versi web.");
  },
  async "/api/pdf/merge"(list){
    const {PDFDocument} = await PDFL(), d = await PDFDocument.create();
    for(const f of list){
      if(extOf(f.name) === "pdf" || f.type === PDFMIME){ const s = await pdfLoad(f); (await d.copyPages(s, s.getPageIndices())).forEach(p => d.addPage(p)); }
      else await addImagePage(d, f, true);
    }
    return res(await pdfOut(d), stem(list[0].name) + "_gabungan.pdf");
  },
  async "/api/pdf/split"([f], v){
    const {PDFDocument} = await PDFL(), s = await pdfLoad(f), n = s.getPageCount(), name = stem(f.name);
    if(v.mode === "all"){
      const items = [];
      for(let i = 0; i < n; i++){ const d = await PDFDocument.create(); d.addPage((await d.copyPages(s, [i]))[0]); items.push([`${name}_hal${pad3(i + 1)}.pdf`, await pdfOut(d)]); }
      return res(await zipBlob(items), name + "_per_halaman.zip");
    }
    const d = await PDFDocument.create();
    (await d.copyPages(s, parsePages(v.pages, n))).forEach(p => d.addPage(p));
    return res(await pdfOut(d), `${name}_hal_${String(v.pages).replace(/[^\d-]+/g, "_")}.pdf`);
  },
  async "/api/pdf/delete"([f], v){
    const {PDFDocument} = await PDFL(), s = await pdfLoad(f), n = s.getPageCount(), drop = new Set(parsePages(v.pages, n));
    const keep = [...Array(n).keys()].filter(i => !drop.has(i));
    if(!keep.length) throw new Error("Tidak bisa menghapus semua halaman.");
    const d = await PDFDocument.create(); (await d.copyPages(s, keep)).forEach(p => d.addPage(p));
    return res(await pdfOut(d), stem(f.name) + "_edit.pdf");
  },
  async "/api/pdf/rotate"([f], v){
    const {degrees} = await PDFL(), d = await pdfLoad(f);
    for(const i of parsePages(v.pages, d.getPageCount())){ const p = d.getPage(i); p.setRotation(degrees((p.getRotation().angle + (+v.angle || 90)) % 360)); }
    return res(await pdfOut(d), stem(f.name) + "_putar.pdf");
  },
  async "/api/pdf/compress"([f], v){
    const {PDFDocument} = await PDFL(), doc = await pdfjsDoc(f), d = await PDFDocument.create();
    const [dpi, q] = {low:[150, .8], medium:[110, .65], high:[80, .5]}[v.level] || [110, .65];
    for(let i = 1; i <= doc.numPages; i++){
      const {c, w1, h1} = await renderPage(doc, i, dpi / 72);
      const img = await d.embedJpg(await bytesOf(await canvasBlob(c, "image/jpeg", q))); c.width = c.height = 0;
      d.addPage([w1, h1]).drawImage(img, {x:0, y:0, width:w1, height:h1});
    }
    let blob = await pdfOut(d);
    if(blob.size >= f.size) blob = new Blob([await f.arrayBuffer()], {type:PDFMIME});
    return res(blob, stem(f.name) + "_kompres.pdf", f.size);
  },
  async "/api/pdf/pagenum"([f], v){
    const {StandardFonts, rgb} = await PDFL(), d = await pdfLoad(f), font = await d.embedFont(StandardFonts.Helvetica);
    const n = d.getPageCount(), start = Math.max(0, parseInt(v.start) || 1), [vert, hor] = (v.position || "bottom-center").split("-");
    d.getPages().forEach((p, i) => {
      const k = i + start, label = v.style === "n/total" ? `${k} / ${n + start - 1}` : v.style === "halaman" ? `Halaman ${k}` : String(k);
      const {width:W, height:H} = p.getSize(), mb = p.getMediaBox(), tw = font.widthOfTextAtSize(label, 10);
      const x = hor === "left" ? 36 : hor === "right" ? W - 36 - tw : (W - tw) / 2;
      p.drawText(label, {x:x + mb.x, y:(vert === "top" ? H - 30 : 24) + mb.y, size:10, font, color:rgb(.25, .25, .25)});
    });
    return res(await pdfOut(d), stem(f.name) + "_nomor.pdf");
  },
  async "/api/pdf/watermark"([f], v){
    const {StandardFonts, rgb, degrees} = await PDFL(), d = await pdfLoad(f), font = await d.embedFont(StandardFonts.HelveticaBold);
    const text = safe(v.text).trim().slice(0, 60); if(!text) throw new Error("Tulis teks watermark.");
    for(const p of d.getPages()){
      const {width:W, height:H} = p.getSize(), mb = p.getMediaBox(), deg = W < H ? 45 : 30, r = deg * Math.PI / 180;
      const fs = Math.max(24, Math.min(110, W * 1.1 / Math.max(4, text.length))), tw = font.widthOfTextAtSize(text, fs);
      const x = W / 2 - tw / 2 * Math.cos(r) + fs / 3 * Math.sin(r), y = H / 2 - tw / 2 * Math.sin(r) - fs / 3 * Math.cos(r);
      p.drawText(text, {x:x + mb.x, y:y + mb.y, size:fs, font, color:rgb(.5, .5, .5), opacity:+v.opacity || .18, rotate:degrees(deg)});
    }
    return res(await pdfOut(d), stem(f.name) + "_watermark.pdf");
  },
  async "/api/pdf/from-images"(list, v){
    const {PDFDocument} = await PDFL(), d = await PDFDocument.create();
    for(const f of list) await addImagePage(d, f, v.page !== "fit");
    return res(await pdfOut(d), stem(list[0].name) + (list.length > 1 ? "_dkk" : "") + ".pdf");
  },
  async "/api/pdf/to-images"([f], v){
    return pdfImages(f, v.format === "png" ? "png" : "jpg", {low:96, medium:150, high:220}[v.quality] || 150);
  }
};

route();
}
